[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "karyoprog"
version = "1.1.0"
description = "Per-disease cytogenetic progression models (co-occurrence, CBN, MHN) from Mitelman karyotypes"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Shubhodeep Chatterjee"}]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "networkx>=3.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
report = ["python-docx>=1.1"]

[project.scripts]
karyoprog = "karyoprog.__main__:main"

[project.urls]
Repository = "https://github.com/shubhodeepcx/MitelmanProgression"

[tool.setuptools]
packages = ["karyoprog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E401", "E402", "E701", "E702", "E731", "E741", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
"report/report_text.py" = ["F821", "E712", "E501", "F541"]   # executed by build_report.py, which defines the names
"report/build_report.py" = ["F401", "E501"]           # names and captions used by report_text.py
