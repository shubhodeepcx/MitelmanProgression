name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check karyoprog scripts tests report
      - name: Tests
        run: OMP_NUM_THREADS=1 python -m pytest -q tests
